<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderlust — Japan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── Travel World Colombia palette ──
   Primary dark:   #0a1628  (deep navy)
   Primary blue:   #1a3a6b  (navy blue)
   Accent orange:  #f4821f  (vivid orange — brand CTA color)
   Accent gold:    #e6a817  (warm gold)
   Light bg:       #f5f7fa
   White:          #ffffff
   Text dark:      #1a1a2e
   Text muted:     rgba(255,255,255,0.6)
*/
:root{
  --navy:    #0a1628;
  --blue:    #1a3a6b;
  --orange:  #f4821f;
  --gold:    #e6a817;
  --light:   #f5f7fa;
  --white:   #ffffff;
  --dark:    #1a1a2e;
  --dim:     rgba(255,255,255,0.6);
  --card-bg: rgba(255,255,255,0.04);
  --border:  rgba(255,255,255,0.1);
}

html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden}

/* ─── HERO ─── */
.hero{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bg-a,.bg-b{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1s ease}
.bg-b{opacity:0}
.bg-overlay{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(to right, rgba(10,22,40,.95) 36%, rgba(10,22,40,.2) 100%),
    linear-gradient(to top, rgba(10,22,40,.98) 0%, transparent 52%);
}
.glow{
  position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(244,130,31,.25) 0%,transparent 70%);
  top:26%;left:50%;filter:blur(50px);z-index:2;
  animation:pulseGlow 4s ease-in-out infinite alternate;pointer-events:none;
  transition:background .8s;
}
@keyframes pulseGlow{from{opacity:.5}to{opacity:.9}}

/* NAV */
nav{
  position:relative;z-index:10;display:flex;align-items:center;gap:28px;
  padding:18px 24px;
  background:linear-gradient(to bottom,rgba(10,22,40,.8) 0%,transparent 100%);
  animation:fadeDown .8s .2s both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.logo{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;color:var(--white);display:flex;align-items:center;gap:8px;margin-right:auto}
.logo-mark{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--orange),var(--gold));
  display:grid;place-items:center;font-size:13px;color:var(--white);font-weight:700;
}
.nav-links{display:flex;gap:24px;list-style:none}
.nav-links a{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;color:var(--dim);text-decoration:none;text-transform:uppercase;transition:color .3s}
.nav-links a:hover{color:var(--orange)}
@media(max-width:600px){.nav-links,.search-box{display:none}}
.search-box{display:flex;align-items:center;border:1px solid var(--border);border-radius:3px;padding:5px 12px;gap:6px;backdrop-filter:blur(4px);background:rgba(255,255,255,.05)}
.search-box input{background:none;border:none;outline:none;color:var(--white);font-size:10px;letter-spacing:.1em;width:100px;font-family:'Inter',sans-serif}
.search-box input::placeholder{color:var(--dim)}
.menu-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.menu-btn span{display:block;height:1.5px;background:var(--white)}
.menu-btn span:nth-child(1){width:22px}
.menu-btn span:nth-child(2){width:14px}

/* HERO CONTENT */
.hero-content{position:relative;z-index:10;padding:0 24px;flex:1;display:flex;flex-direction:column;justify-content:center;max-width:580px;animation:fadeUp .9s .5s both}
.ct{transition:opacity .35s ease,transform .35s ease}
.ct.fading{opacity:0;transform:translateY(12px)}
.kana{font-size:12px;font-weight:300;letter-spacing:.4em;color:var(--gold);margin-bottom:6px;opacity:.85}
h1{font-family:'Playfair Display',serif;font-size:clamp(52px,12vw,100px);font-weight:900;line-height:.88;letter-spacing:-.02em;color:var(--white)}
.divider{width:44px;height:2px;background:linear-gradient(to right,var(--orange),var(--gold));margin:18px 0;border-radius:2px}
.quote-text{font-size:clamp(11px,2.8vw,13px);line-height:1.8;color:var(--dim);max-width:330px;font-weight:300}
.author{display:flex;align-items:center;gap:10px;margin-top:16px}
.author-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--orange),var(--gold));
  display:grid;place-items:center;font-size:11px;font-weight:700;
  color:var(--white);border:2px solid rgba(244,130,31,.4);flex-shrink:0;
}
.author-name{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:var(--white)}
.author-title{font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.cta-row{display:flex;align-items:center;gap:20px;margin-top:28px;flex-wrap:wrap}

/* Buttons */
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--orange),#e06b10);
  color:#fff;border:none;cursor:pointer;
  padding:13px 26px;font-family:'Cinzel',serif;font-size:10px;
  letter-spacing:.25em;text-transform:uppercase;transition:all .3s;
  border-radius:3px;box-shadow:0 4px 16px rgba(244,130,31,.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(244,130,31,.5)}
.btn-outline{
  display:inline-flex;align-items:center;gap:8px;
  background:none;border:1px solid rgba(244,130,31,.5);
  color:var(--white);cursor:pointer;
  padding:13px 22px;font-family:'Cinzel',serif;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;transition:all .3s;border-radius:3px;
}
.btn-outline:hover{border-color:var(--orange);background:rgba(244,130,31,.1)}

/* THUMBNAILS */
.thumbnails-bar{position:relative;z-index:10;display:flex;align-items:center;gap:10px;padding:16px 24px 24px;animation:fadeUp .9s 1.2s both}
.thumb-arrow{width:30px;height:30px;border:1.5px solid rgba(244,130,31,.4);border-radius:50%;display:grid;place-items:center;cursor:pointer;background:none;color:var(--dim);transition:all .3s;flex-shrink:0}
.thumb-arrow:hover{border-color:var(--orange);color:var(--orange);background:rgba(244,130,31,.1)}
.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{width:54px;height:54px;border-radius:50%;overflow:hidden;cursor:pointer;border:2.5px solid transparent;transition:all .35s;position:relative;flex-shrink:0}
.thumb::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:50%;transition:background .3s}
.thumb.active{border-color:var(--orange);transform:scale(1.12);box-shadow:0 0 14px rgba(244,130,31,.5)}
.thumb.active::after{background:transparent}
.thumb:hover:not(.active){border-color:rgba(244,130,31,.3)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* ─── SECTIONS SHARED ─── */
.section-divider{width:100%;height:1px;background:linear-gradient(to right,transparent,rgba(244,130,31,.3),transparent)}
section.content-section{padding:72px 24px;max-width:1100px;margin:0 auto}
.section-tag{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.4em;color:var(--orange);text-transform:uppercase;margin-bottom:10px}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(26px,5vw,44px);font-weight:700;color:var(--white);line-height:1.1;margin-bottom:18px}
.section-body{font-size:14px;line-height:1.85;color:var(--dim);max-width:600px}
.page-transition{transition:opacity .4s ease}
.page-transition.fading{opacity:0}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
@media(max-width:700px){.about-grid{grid-template-columns:1fr}}
.about-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;filter:brightness(.85) saturate(1.1);border:1px solid var(--border)}
.about-stats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.stat{border-left:3px solid var(--orange);padding-left:14px;background:rgba(244,130,31,.05);padding:12px 12px 12px 16px;border-radius:0 4px 4px 0}
.stat-num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--orange)}
.stat-label{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}

/* HIGHLIGHTS */
.highlights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
@media(max-width:700px){.highlights-grid{grid-template-columns:1fr}}
.highlight-card{
  background:rgba(26,58,107,.4);
  border:1px solid rgba(244,130,31,.15);
  padding:24px;transition:all .3s;cursor:default;border-radius:4px;
}
.highlight-card:hover{background:rgba(244,130,31,.1);border-color:rgba(244,130,31,.4);transform:translateY(-4px);box-shadow:0 8px 24px rgba(244,130,31,.15)}
.hc-icon{font-size:26px;margin-bottom:14px}
.hc-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:var(--orange);margin-bottom:8px;text-transform:uppercase}
.hc-body{font-size:12px;line-height:1.75;color:var(--dim)}

/* GALLERY */
.gallery-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:190px 190px;gap:3px;margin-top:36px;border-radius:4px;overflow:hidden}
@media(max-width:600px){.gallery-grid{grid-template-columns:1fr 1fr;grid-template-rows:130px 130px 130px}}
.gallery-img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.8) saturate(1.1);transition:filter .4s transform .4s}
.gallery-img:hover{filter:brightness(1) saturate(1.2);transform:scale(1.02)}
.gallery-item:first-child{grid-row:1/3}
@media(max-width:600px){.gallery-item:first-child{grid-row:auto}}

/* KEY INFO */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:36px}
@media(max-width:500px){.info-grid{grid-template-columns:1fr}}
.info-card{
  background:rgba(26,58,107,.35);
  border:1px solid var(--border);
  padding:18px;display:flex;gap:14px;align-items:flex-start;border-radius:4px;
  transition:border-color .3s;
}
.info-card:hover{border-color:rgba(244,130,31,.35)}
.info-icon{font-size:20px;flex-shrink:0;margin-top:2px}
.info-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;color:var(--orange);text-transform:uppercase;margin-bottom:4px}
.info-value{font-size:13px;color:var(--white);font-weight:500}
.info-sub{font-size:11px;color:var(--dim);margin-top:2px}

/* CTA BANNER */
.cta-banner{position:relative;overflow:hidden;padding:80px 24px;text-align:center}
.cta-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.2) saturate(.7);transition:background-image .8s}
.cta-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,58,107,.7) 0%,rgba(10,22,40,.8) 100%)}
.cta-inner{position:relative;z-index:2;max-width:600px;margin:0 auto}
.cta-title{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,46px);font-weight:700;color:var(--white);margin-bottom:14px}
.cta-sub{font-size:14px;color:var(--dim);line-height:1.75;margin-bottom:32px}
.btn-big{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--orange),#e06b10);
  color:#fff;border:none;cursor:pointer;
  padding:16px 36px;font-family:'Cinzel',serif;font-size:11px;
  letter-spacing:.3em;text-transform:uppercase;transition:all .3s;
  border-radius:3px;box-shadow:0 6px 20px rgba(244,130,31,.4);
}
.btn-big:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(244,130,31,.55)}

/* FOOTER */
footer{
  padding:28px 24px;
  background:var(--dark);
  border-top:1px solid rgba(244,130,31,.2);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
}
.footer-logo{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.3em;color:var(--dim);display:flex;align-items:center;gap:8px}
.footer-logo-mark{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--gold));display:grid;place-items:center;font-size:10px;font-weight:700}
.footer-copy{font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.1em}
</style>
</head>

<!-- ═══ KEY INFO ═══ -->
<section class="content-section" id="keyinfo">

<footer>

let current = 2, bgActive = 'a';
const bgA = document.getElementById('bgA');
const bgB = document.getElementById('bgB');
const ct = document.getElementById('ct');
const thumbsContainer = document.getElementById('thumbsContainer');
const ctaBg = document.getElementById('ctaBg');
const pageSections = ['aboutSec','highlightsSec','gallerySec','keyinfoSec','ctaSec'];

destinations.forEach((d,i) => {
  const el = document.createElement('div');
  el.className = 'thumb'+(i===current?' active':'');
  el.innerHTML = `<img src="${d.thumb}" alt="${d.title}" loading="lazy">`;
  el.addEventListener('click', () => switchTo(i));
  thumbsContainer.appendChild(el);
});

function setBg(url) {
  if (bgActive==='a') {
    bgB.style.backgroundImage=`url('${url}')`;bgB.style.opacity='1';bgA.style.opacity='0';bgActive='b';
  } else {
    bgA.style.backgroundImage=`url('${url}')`;bgA.style.opacity='1';bgB.style.opacity='0';bgActive='a';
  }
}

function renderDestination(d) {
  document.getElementById('kana').textContent=d.kana;
  document.getElementById('title').textContent=d.title;
  document.getElementById('quote').textContent=d.quote;
  document.getElementById('avatar').textContent=d.avatar;
  document.getElementById('authorName').textContent=d.author;
  document.getElementById('authorTitle').textContent=d.authorTitle;
  document.getElementById('aboutTag').textContent=d.aboutTag;
  document.getElementById('aboutTitle').textContent=d.aboutTitle;
  document.getElementById('aboutBody').textContent=d.aboutBody;
  document.getElementById('aboutImg').src=d.aboutImg;
  document.getElementById('aboutStats').innerHTML=d.stats.map(s=>`<div class="stat"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`).join('');
  document.getElementById('highlightsTitle').textContent=d.highlightsTitle;
  document.getElementById('highlightsGrid').innerHTML=d.highlights.map(h=>`<div class="highlight-card"><div class="hc-icon">${h.icon}</div><div class="hc-title">${h.title}</div><div class="hc-body">${h.body}</div></div>`).join('');
  document.getElementById('galleryTitle').textContent=d.galleryTitle;
  document.getElementById('galleryGrid').innerHTML=d.gallery.map((url,i)=>`<div class="gallery-item"${i===0?' style="grid-row:1/3"':''}><img class="gallery-img" src="${url}" alt="" loading="lazy"></div>`).join('');
  document.getElementById('keyinfoTitle').textContent=d.keyinfoTitle;
  document.getElementById('infoGrid').innerHTML=d.info.map(inf=>`<div class="info-card"><div class="info-icon">${inf.icon}</div><div><div class="info-label">${inf.label}</div><div class="info-value">${inf.value}</div><div class="info-sub">${inf.sub}</div></div></div>`).join('');
  document.getElementById('ctaTag').textContent=d.ctaTag;
  document.getElementById('ctaTitle').textContent=d.ctaTitle;
  document.getElementById('ctaSub').textContent=d.ctaSub;
  ctaBg.style.backgroundImage=`url('${d.bg}')`;
}

function switchTo(i) {
  if(i===current)return;
  current=i;
  const d=destinations[i];
  ct.classList.add('fading');
  pageSections.forEach(id=>document.getElementById(id).classList.add('fading'));
  setTimeout(()=>{
    renderDestination(d);
    ct.classList.remove('fading');
    pageSections.forEach(id=>document.getElementById(id).classList.remove('fading'));
  },380);
  setBg(d.bg);
  document.querySelectorAll('.thumb').forEach((t,idx)=>t.classList.toggle('active',idx===i));
}

bgA.style.backgroundImage=`url('${destinations[current].bg}')`;
bgA.style.opacity='1';
ctaBg.style.backgroundImage=`url('${destinations[current].bg}')`;
renderDestination(destinations[current]);

document.getElementById('prevBtn').addEventListener('click',()=>switchTo((current-1+destinations.length)%destinations.length));
document.getElementById('nextBtn').addEventListener('click',()=>switchTo((current+1)%destinations.length));
</script>
